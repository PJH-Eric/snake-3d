<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fd28a">
  <title>3D貪吃蛇｜免費線上多人貪吃蛇・手機平板可玩</title>
  <meta name="description" content="免費免下載的 3D 貪吃蛇，可愛動物園風，手指或鍵盤自由控制方向，單人衝高分、對戰電腦或線上對戰，手機平板都能玩。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="3D貪吃蛇">
  <meta property="og:description" content="可愛動物園風的 3D 貪吃蛇：單人挑戰、電腦對手、線上房間與觀戰。">
  <meta property="og:image" content="og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #cdeefa;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    #stage { position: fixed; inset: 0; }
    #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #cdeefa; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(#cdeefa, #e9f8d8); color: #3d2f2a; gap: 18px; transition: opacity .3s; }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .logo { width: 96px; height: 96px; }
    #loading h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
    #bar { width: min(320px, 70vw); height: 18px; border: 3px solid #3d2f2a; border-radius: 12px; background: #fff; overflow: hidden; }
    #fill { height: 100%; width: 0%; background: #8fd28a; transition: width .15s; }
    #msg { font-size: 16px; opacity: .8; text-align: center; padding: 0 24px; }
    #err { display: none; max-width: 420px; text-align: center; font-size: 17px; line-height: 1.5; padding: 0 24px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <img class="logo" src="icon.svg" alt="">
      <h1>3D貪吃蛇</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="msg">載入中⋯ Loading</div>
      <div id="err"></div>
    </div>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    (function () {
      var canvas = document.getElementById('unity-canvas');
      var fill = document.getElementById('fill');
      var loading = document.getElementById('loading');
      var err = document.getElementById('err');
      var msg = document.getElementById('msg');
      var zh = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0;
      if (!zh) { msg.textContent = 'Loading…'; }

      function fail(text) {
        err.style.display = 'block'; err.textContent = text;
        document.getElementById('bar').style.display = 'none'; msg.style.display = 'none';
      }

      var cfg = {
        dataUrl: 'Build/{{{ DATA_FILENAME }}}',
        frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
        codeUrl: 'Build/{{{ CODE_FILENAME }}}',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // 高解析螢幕上限 2 倍，避免平板/手機渲染過重
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        matchWebGLToCanvasSize: true
      };

      // 阻擋瀏覽器預設手勢（雙指縮放、下拉重新整理、右鍵選單）
      ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu'].forEach(function (n) {
        document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

      createUnityInstance(canvas, cfg, function (p) { fill.style.width = Math.round(p * 100) + '%'; })
        .then(function () {
          loading.classList.add('hide');
          setTimeout(function () { loading.style.display = 'none'; }, 400);
          canvas.focus();
        })
        .catch(function (e) {
          console.error(e);
          fail(zh ? '載入失敗，請確認瀏覽器支援 WebGL 2 後重新整理。' : 'Failed to load. Please use a browser with WebGL 2 and reload.');
        });
    })();
  </script>
</body>
</html>
